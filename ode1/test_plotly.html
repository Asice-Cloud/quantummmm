<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>body{margin:0;background:#0d0d1a}#plot{width:100vw;height:100vh}</style>
</head><body><div id="plot"></div><script>
Plotly.newPlot('plot',[{
  x:[0,0.5,1,-0.5], y:[0,0.5,0,-0.5], z:[1,0.5,0,0.5],
  type:'scatter3d', mode:'markers',
  marker:{size:12,color:'orange'}
}],{
  paper_bgcolor:'#0d0d1a',
  scene:{xaxis:{range:[-1,1]},yaxis:{range:[-1,1]},zaxis:{range:[-1,1]}}
},{responsive:true});
</script></body></html>
